name: npmjs release

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v5
        with:
          # Must satisfy the "engines.node" range in package.json - "npm publish"
          # runs prepublishOnly (lint, test, build), which needs a supported Node.
          node-version: 22.x
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
